[package]
name = "tcp_handshake_demo"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["full"] }
bytes = "1"
futures = "0.3"
log = "0.4"
env_logger = "0.10"
dashmap = "6.1.0"
anyhow = "1.0.98"
uuid = { version = "1.16.0", features = ["v4"] }
tracing = "0.1.41"


[[bin]]
name = "server"
path = "src/server.rs"

[[bin]]
name = "client"
path = "src/client.rs"
